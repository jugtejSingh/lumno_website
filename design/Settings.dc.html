<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="stylesheet" href="_ds/lumno-design-system-956520e3-f2c4-4c83-b4ca-b9c329d93743/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/lumno-design-system-956520e3-f2c4-4c83-b4ca-b9c329d93743/tokens/colors.css">
  <link rel="stylesheet" href="_ds/lumno-design-system-956520e3-f2c4-4c83-b4ca-b9c329d93743/tokens/typography.css">
  <link rel="stylesheet" href="_ds/lumno-design-system-956520e3-f2c4-4c83-b4ca-b9c329d93743/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/lumno-design-system-956520e3-f2c4-4c83-b4ca-b9c329d93743/tokens/radius.css">
  <link rel="stylesheet" href="_ds/lumno-design-system-956520e3-f2c4-4c83-b4ca-b9c329d93743/tokens/shadows.css">
  <link rel="stylesheet" href="_ds/lumno-design-system-956520e3-f2c4-4c83-b4ca-b9c329d93743/tokens/base.css">
  <link rel="stylesheet" href="_ds/lumno-design-system-956520e3-f2c4-4c83-b4ca-b9c329d93743/styles.css">
  <script src="_ds/lumno-design-system-956520e3-f2c4-4c83-b4ca-b9c329d93743/_ds_bundle.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>:root{--font-body:'Manrope','Helvetica Neue',Arial,sans-serif;}</style>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { margin: 0; }
    a { color: var(--accent-primary); text-decoration: none; }
    a:hover { color: var(--accent-primary-hover); }
  </style>
</helmet>
<div style="display:flex;height:100vh;background:var(--surface-app);font-family:var(--font-body)">
  <div style="width:220px;flex-shrink:0;border-right:1px solid var(--border-subtle);padding:16px;display:flex;flex-direction:column;gap:4px">
    <a href="Home.dc.html" style="font-family:var(--font-display);font-style:italic;font-size:26px;margin-bottom:18px;padding-left:4px;color:var(--text-primary)">Lumno</a>
    <a href="Dashboard.dc.html"><x-import component-from-global-scope="LumnoDesignSystem_956520.SidebarNavItem" label="Dashboard" hint-size="100%,40px"></x-import></a>
    <a href="Calendar.dc.html"><x-import component-from-global-scope="LumnoDesignSystem_956520.SidebarNavItem" label="Calendar" hint-size="100%,40px"></x-import></a>
    <a href="Payments.dc.html"><x-import component-from-global-scope="LumnoDesignSystem_956520.SidebarNavItem" label="Payments" hint-size="100%,40px"></x-import></a>
    <a href="Notes.dc.html"><x-import component-from-global-scope="LumnoDesignSystem_956520.SidebarNavItem" label="Notes" hint-size="100%,40px"></x-import></a>
    <a href="Referrals.dc.html"><x-import component-from-global-scope="LumnoDesignSystem_956520.SidebarNavItem" label="Referrals" hint-size="100%,40px"></x-import></a>
    <a href="Settings.dc.html"><x-import component-from-global-scope="LumnoDesignSystem_956520.SidebarNavItem" label="Settings" active="{{ true }}" hint-size="100%,40px"></x-import></a>
    <div style="flex:1"></div>
    <a href="Login.dc.html"><x-import component-from-global-scope="LumnoDesignSystem_956520.SidebarNavItem" label="Log out" hint-size="100%,40px"></x-import></a>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border-subtle)">
      <div style="font-weight:700;font-size:15px;color:var(--text-primary)">Settings</div>
      <x-import component-from-global-scope="LumnoDesignSystem_956520.Avatar" name="Dana Reyes" size="30" hint-size="30,30"></x-import>
    </div>
    <div style="flex:1;padding:24px;overflow-y:auto">
      <div style="display:flex;flex-direction:column;gap:24px;max-width:640px">
        <div style="display:flex;justify-content:space-between;align-items:flex-end">
          <div style="font-family:var(--font-display);font-size:32px;color:var(--text-primary)">Settings</div>
          <x-import component-from-global-scope="LumnoDesignSystem_956520.Button" variant="primary" onClick="{{ save }}" hint-size="auto,40px">{{ saveLabel }}</x-import>
        </div>

        <x-import component-from-global-scope="LumnoDesignSystem_956520.Card" hint-size="100%,1">
          <div style="display:flex;flex-direction:column;gap:14px">
            <div style="font-size:15px;font-weight:700;color:var(--text-primary)">Referral profile</div>
            <div style="display:flex;align-items:center;gap:12px">
              <x-import component-from-global-scope="LumnoDesignSystem_956520.Avatar" name="{{ name }}" size="44" hint-size="44,44"></x-import>
              <div style="flex:1"><x-import component-from-global-scope="LumnoDesignSystem_956520.Input" label="Name" value="{{ name }}" onChange="{{ setName }}" hint-size="100%,60px"></x-import></div>
            </div>
            <div>
              <div style="font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:6px">Specialties</div>
              <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
                <sc-for list="{{ specialtyTags }}" as="s" hint-placeholder-count="3">
                  <x-import component-from-global-scope="LumnoDesignSystem_956520.Tag" color="{{ s.color }}" onRemove="{{ s.remove }}" hint-size="auto,24px">{{ s.label }}</x-import>
                </sc-for>
              </div>
              <div style="display:flex;gap:8px">
                <x-import component-from-global-scope="LumnoDesignSystem_956520.Input" placeholder="Add a specialty and press enter" value="{{ newTag }}" onChange="{{ setNewTag }}" onKeyDown="{{ addTagOnEnter }}" hint-size="100%,44px"></x-import>
              </div>
            </div>
            <x-import component-from-global-scope="LumnoDesignSystem_956520.Textarea" label="Bio" placeholder="A few sentences other therapists will see" value="{{ bio }}" onChange="{{ setBio }}" rows="3" hint-size="100%,90px"></x-import>
            <x-import component-from-global-scope="LumnoDesignSystem_956520.Input" label="Session rate" value="{{ rate }}" onChange="{{ setRate }}" hint-size="220px,60px"></x-import>
          </div>
        </x-import>

        <x-import component-from-global-scope="LumnoDesignSystem_956520.Card" hint-size="100%,1">
          <div style="display:flex;flex-direction:column;gap:10px">
            <div style="font-size:15px;font-weight:700;color:var(--text-primary)">Referral visibility</div>
            <x-import component-from-global-scope="LumnoDesignSystem_956520.Switch" label="List me in Referrals" checked="{{ visible }}" onChange="{{ setVisible }}" hint-size="100%,24px"></x-import>
            <div style="font-size:13px;color:var(--text-muted);line-height:var(--lh-relaxed)">{{ visibilityHelper }}</div>
          </div>
        </x-import>

        <x-import component-from-global-scope="LumnoDesignSystem_956520.Card" hint-size="100%,1">
          <div style="display:flex;flex-direction:column;gap:14px">
            <div style="font-size:15px;font-weight:700;color:var(--text-primary)">Account</div>
            <x-import component-from-global-scope="LumnoDesignSystem_956520.Input" label="Email" type="email" value="{{ email }}" onChange="{{ setEmail }}" hint-size="100%,60px"></x-import>
            <x-import component-from-global-scope="LumnoDesignSystem_956520.Input" label="New password" type="password" placeholder="••••••••" value="{{ password }}" onChange="{{ setPassword }}" hint-size="100%,60px"></x-import>
            <div><x-import component-from-global-scope="LumnoDesignSystem_956520.Button" variant="secondary" onClick="{{ updatePassword }}" hint-size="auto,40px">Update password</x-import></div>
          </div>
        </x-import>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    name: 'Dana Reyes', bio: 'Works with adults managing anxiety and life transitions using CBT and mindfulness-based approaches.',
    rate: '$150', visible: true, email: 'dana@reyestherapy.com', password: '', newTag: '',
    specialties: ['Anxiety', 'CBT'], saveLabel: 'Save changes',
  };
  colors = ['plum', 'coral', 'sage', 'citrus'];
  componentDidMount() { this.renderIcons(); }
  componentDidUpdate() { this.renderIcons(); }
  renderIcons() { if (window.lucide) window.lucide.createIcons({ nameAttr: 'data-lucide' }); }
  addTagOnEnter = (e) => {
    if (e.key !== 'Enter') return;
    const v = this.state.newTag.trim();
    if (!v) return;
    this.setState((s) => ({ specialties: [...s.specialties, v], newTag: '' }));
  };
  removeTag = (label) => this.setState((s) => ({ specialties: s.specialties.filter((t) => t !== label) }));
  updatePassword = () => this.setState({ password: '' });
  save = () => {
    this.setState({ saveLabel: 'Saved' });
    setTimeout(() => this.setState({ saveLabel: 'Save changes' }), 1400);
  };
  renderVals() {
    const specialtyTags = this.state.specialties.map((label, i) => ({ label, color: this.colors[i % this.colors.length], remove: () => this.removeTag(label) }));
    return {
      name: this.state.name, setName: (e) => this.setState({ name: e.target.value }),
      specialtyTags,
      newTag: this.state.newTag, setNewTag: (e) => this.setState({ newTag: e.target.value }), addTagOnEnter: this.addTagOnEnter,
      bio: this.state.bio, setBio: (e) => this.setState({ bio: e.target.value }),
      rate: this.state.rate, setRate: (e) => this.setState({ rate: e.target.value }),
      visible: this.state.visible, setVisible: (v) => this.setState({ visible: v }),
      visibilityHelper: this.state.visible
        ? "You're visible to other therapists on the Referrals page. Turn this off any time to disappear from that list."
        : "You're hidden from the Referrals page. Turn this on when you're open to taking referrals.",
      email: this.state.email, setEmail: (e) => this.setState({ email: e.target.value }),
      password: this.state.password, setPassword: (e) => this.setState({ password: e.target.value }),
      updatePassword: this.updatePassword,
      save: this.save, saveLabel: this.state.saveLabel,
    };
  }
}

</script>
</body>
</html>
