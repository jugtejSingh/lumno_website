<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/lumno-design-system-956520e3-f2c4-4c83-b4ca-b9c329d93743/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/lumno-design-system-956520e3-f2c4-4c83-b4ca-b9c329d93743/tokens/colors.css">
  <link rel="stylesheet" href="_ds/lumno-design-system-956520e3-f2c4-4c83-b4ca-b9c329d93743/tokens/typography.css">
  <link rel="stylesheet" href="_ds/lumno-design-system-956520e3-f2c4-4c83-b4ca-b9c329d93743/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/lumno-design-system-956520e3-f2c4-4c83-b4ca-b9c329d93743/tokens/radius.css">
  <link rel="stylesheet" href="_ds/lumno-design-system-956520e3-f2c4-4c83-b4ca-b9c329d93743/tokens/shadows.css">
  <link rel="stylesheet" href="_ds/lumno-design-system-956520e3-f2c4-4c83-b4ca-b9c329d93743/tokens/base.css">
  <link rel="stylesheet" href="_ds/lumno-design-system-956520e3-f2c4-4c83-b4ca-b9c329d93743/styles.css">
  <script src="_ds/lumno-design-system-956520e3-f2c4-4c83-b4ca-b9c329d93743/_ds_bundle.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>:root{--font-body:'Manrope','Helvetica Neue',Arial,sans-serif;}</style>
  <style>
    body { margin: 0; }
    a { color: var(--accent-primary); }
    a:hover { color: var(--accent-primary-hover); }
  </style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;background:var(--surface-app);font-family:var(--font-body)">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 48px;border-bottom:1px solid var(--border-subtle)">
    <a href="Home.dc.html" style="font-family:var(--font-display);font-style:italic;font-size:26px;color:var(--text-primary);text-decoration:none">Lumno</a>
  </div>
  <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:40px">
    <div style="width:380px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:36px">
      <div style="display:flex;gap:4px;margin-bottom:20px;background:var(--beige-200);border-radius:var(--radius-pill);padding:4px">
        <button onClick="{{ selectTherapist }}" style="{{ therapistBtnStyle }}">Therapist</button>
        <button onClick="{{ selectClient }}" style="{{ clientBtnStyle }}">Client</button>
      </div>
      <x-import component-from-global-scope="LumnoDesignSystem_956520.Tabs" tabs="{{ tabList }}" active="{{ tab }}" onChange="{{ setTab }}" hint-size="100%,40px"></x-import>

      <sc-if value="{{ isLogin }}" hint-placeholder-val="{{ true }}">
        <div style="margin-top:24px">
          <div style="font-family:var(--font-display);font-size:30px;color:var(--text-primary)">Welcome back</div>
          <div style="font-size:14px;color:var(--text-muted);margin-top:4px;margin-bottom:24px">{{ loginSubtitle }}</div>
          <div style="display:flex;flex-direction:column;gap:14px">
            <x-import component-from-global-scope="LumnoDesignSystem_956520.Input" label="Email" placeholder="you@practice.com" type="email" value="{{ email }}" onChange="{{ setEmail }}" hint-size="100%,60px"></x-import>
            <x-import component-from-global-scope="LumnoDesignSystem_956520.Input" label="Password" placeholder="••••••••" type="password" value="{{ password }}" onChange="{{ setPassword }}" hint-size="100%,60px"></x-import>
            <div style="text-align:right"><a href="#" style="font-size:13px;color:var(--text-muted);text-decoration:none">Forgot password?</a></div>
            <a href="{{ loginHref }}" style="text-decoration:none"><x-import component-from-global-scope="LumnoDesignSystem_956520.Button" variant="primary" hint-size="100%,44px">Log in</x-import></a>
          </div>
          <sc-if value="{{ isTherapistRole }}" hint-placeholder-val="{{ true }}">
            <div style="margin-top:20px;font-size:13px;color:var(--text-secondary);text-align:center">Don't have an account? <a href="#" onClick="{{ goRegister }}" style="color:var(--accent-primary);font-weight:700">Register</a></div>
          </sc-if>
        </div>
      </sc-if>

      <sc-if value="{{ isRegister }}" hint-placeholder-val="{{ false }}">
        <div style="margin-top:24px">
          <div style="font-family:var(--font-display);font-size:30px;color:var(--text-primary)">Create your account</div>
          <div style="font-size:14px;color:var(--text-muted);margin-top:4px;margin-bottom:24px">Set up your practice in about two minutes</div>
          <div style="display:flex;flex-direction:column;gap:14px">
            <x-import component-from-global-scope="LumnoDesignSystem_956520.Input" label="Full name" placeholder="Dana Reyes" value="{{ name }}" onChange="{{ setName }}" hint-size="100%,60px"></x-import>
            <x-import component-from-global-scope="LumnoDesignSystem_956520.Input" label="Practice name" placeholder="Reyes Therapy" value="{{ practice }}" onChange="{{ setPractice }}" hint-size="100%,60px"></x-import>
            <x-import component-from-global-scope="LumnoDesignSystem_956520.Input" label="Email" placeholder="you@practice.com" type="email" value="{{ email }}" onChange="{{ setEmail }}" hint-size="100%,60px"></x-import>
            <x-import component-from-global-scope="LumnoDesignSystem_956520.Input" label="Password" placeholder="••••••••" type="password" value="{{ password }}" onChange="{{ setPassword }}" hint-size="100%,60px"></x-import>
            <a href="Dashboard.dc.html" style="text-decoration:none"><x-import component-from-global-scope="LumnoDesignSystem_956520.Button" variant="primary" hint-size="100%,44px">Create account</x-import></a>
          </div>
          <div style="margin-top:20px;font-size:13px;color:var(--text-secondary);text-align:center">Already have an account? <a href="#" onClick="{{ goLogin }}" style="color:var(--accent-primary);font-weight:700">Log in</a></div>
        </div>
      </sc-if>
    </div>
  </div>
  <div style="border-top:1px solid var(--border-subtle);padding:28px 48px;display:flex;align-items:center;justify-content:space-between;font-family:var(--font-body)">
    <div style="font-family:var(--font-display);font-style:italic;font-size:18px;color:var(--text-primary)">Lumno</div>
    <div style="font-size:13px;color:var(--text-muted)">&#169; 2026 Lumno. Practice management for therapists.</div>
    <a href="Home.dc.html" style="font-size:13px;color:var(--text-muted);text-decoration:none">Home</a>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { tab: 'Log in', email: '', password: '', name: '', practice: '', role: 'Therapist' };
  componentDidMount() {
    const params = new URLSearchParams(window.location.search);
    if (params.get('tab') === 'register') this.setState({ tab: 'Register' });
  }
  selectTherapist = () => this.setState({ role: 'Therapist' });
  selectClient = () => this.setState({ role: 'Client', tab: 'Log in' });
  renderVals() {
    const isTherapistRole = this.state.role === 'Therapist';
    const tabList = isTherapistRole ? ['Log in', 'Register'] : ['Log in'];
    const pillBase = 'flex:1;padding:8px 0;border:none;border-radius:var(--radius-pill);font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font-body)';
    return {
      tabList,
      isTherapistRole,
      loginHref: isTherapistRole ? 'Dashboard.dc.html' : 'ClientPortal.dc.html',
      loginSubtitle: isTherapistRole ? 'Log in to your practice' : 'Log in to view your sessions, payments, and notes',
      selectTherapist: this.selectTherapist,
      selectClient: this.selectClient,
      therapistBtnStyle: `${pillBase};background:${isTherapistRole ? 'var(--surface-card)' : 'transparent'};color:${isTherapistRole ? 'var(--text-primary)' : 'var(--text-muted)'};box-shadow:${isTherapistRole ? 'var(--shadow-xs)' : 'none'}`,
      clientBtnStyle: `${pillBase};background:${!isTherapistRole ? 'var(--surface-card)' : 'transparent'};color:${!isTherapistRole ? 'var(--text-primary)' : 'var(--text-muted)'};box-shadow:${!isTherapistRole ? 'var(--shadow-xs)' : 'none'}`,
      tab: this.state.tab,
      isLogin: this.state.tab === 'Log in',
      isRegister: this.state.tab === 'Register',
      email: this.state.email,
      password: this.state.password,
      name: this.state.name,
      practice: this.state.practice,
      setTab: (t) => this.setState({ tab: t }),
      setEmail: (e) => this.setState({ email: e.target.value }),
      setPassword: (e) => this.setState({ password: e.target.value }),
      setName: (e) => this.setState({ name: e.target.value }),
      setPractice: (e) => this.setState({ practice: e.target.value }),
      goRegister: (e) => { e.preventDefault(); this.setState({ tab: 'Register' }); },
      goLogin: (e) => { e.preventDefault(); this.setState({ tab: 'Log in' }); },
    };
  }
}
</script>
</body>
</html>
