<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/lumno-design-system-956520e3-f2c4-4c83-b4ca-b9c329d93743/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/lumno-design-system-956520e3-f2c4-4c83-b4ca-b9c329d93743/tokens/colors.css">
  <link rel="stylesheet" href="_ds/lumno-design-system-956520e3-f2c4-4c83-b4ca-b9c329d93743/tokens/typography.css">
  <link rel="stylesheet" href="_ds/lumno-design-system-956520e3-f2c4-4c83-b4ca-b9c329d93743/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/lumno-design-system-956520e3-f2c4-4c83-b4ca-b9c329d93743/tokens/radius.css">
  <link rel="stylesheet" href="_ds/lumno-design-system-956520e3-f2c4-4c83-b4ca-b9c329d93743/tokens/shadows.css">
  <link rel="stylesheet" href="_ds/lumno-design-system-956520e3-f2c4-4c83-b4ca-b9c329d93743/tokens/base.css">
  <link rel="stylesheet" href="_ds/lumno-design-system-956520e3-f2c4-4c83-b4ca-b9c329d93743/styles.css">
  <script src="_ds/lumno-design-system-956520e3-f2c4-4c83-b4ca-b9c329d93743/_ds_bundle.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>:root{--font-body:'Manrope','Helvetica Neue',Arial,sans-serif;}</style>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { margin: 0; }
    a { color: var(--accent-primary); text-decoration: none; }
    a:hover { color: var(--accent-primary-hover); }
  </style>
</helmet>
<div style="display:flex;height:100vh;background:var(--surface-app);font-family:var(--font-body)">
  <div style="width:220px;flex-shrink:0;border-right:1px solid var(--border-subtle);padding:16px;display:flex;flex-direction:column;gap:4px">
    <a href="Home.dc.html" style="font-family:var(--font-display);font-style:italic;font-size:26px;margin-bottom:18px;padding-left:4px;color:var(--text-primary)">Lumno</a>
    <a href="Dashboard.dc.html"><x-import component-from-global-scope="LumnoDesignSystem_956520.SidebarNavItem" label="Dashboard" active="{{ true }}" hint-size="100%,40px"></x-import></a>
    <a href="Calendar.dc.html"><x-import component-from-global-scope="LumnoDesignSystem_956520.SidebarNavItem" label="Calendar" hint-size="100%,40px"></x-import></a>
    <a href="Payments.dc.html"><x-import component-from-global-scope="LumnoDesignSystem_956520.SidebarNavItem" label="Payments" hint-size="100%,40px"></x-import></a>
    <a href="Notes.dc.html"><x-import component-from-global-scope="LumnoDesignSystem_956520.SidebarNavItem" label="Notes" hint-size="100%,40px"></x-import></a>
    <a href="Referrals.dc.html"><x-import component-from-global-scope="LumnoDesignSystem_956520.SidebarNavItem" label="Referrals" hint-size="100%,40px"></x-import></a>
    <a href="Settings.dc.html"><x-import component-from-global-scope="LumnoDesignSystem_956520.SidebarNavItem" label="Settings" hint-size="100%,40px"></x-import></a>
    <div style="flex:1"></div>
    <a href="Login.dc.html"><x-import component-from-global-scope="LumnoDesignSystem_956520.SidebarNavItem" label="Log out" hint-size="100%,40px"></x-import></a>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border-subtle)">
      <div style="font-weight:700;font-size:15px;color:var(--text-primary)">Dashboard</div>
      <x-import component-from-global-scope="LumnoDesignSystem_956520.Avatar" name="Dana Reyes" size="30" hint-size="30,30"></x-import>
    </div>
    <div style="flex:1;padding:24px;overflow-y:auto">
      <div style="display:flex;flex-direction:column;gap:24px;max-width:960px">
        <div>
          <div style="font-family:var(--font-display);font-size:40px;color:var(--text-primary)">Good afternoon, Dana</div>
          <div style="font-family:var(--font-display);font-style:italic;font-size:22px;color:var(--accent-primary);margin-top:2px">You have {{ todayCount }} sessions today</div>
        </div>
        <div style="display:flex;gap:14px">
          <x-import component-from-global-scope="LumnoDesignSystem_956520.StatCard" label="Sessions this week" value="12" delta="+2 vs last week" accent="plum" hint-size="1,1"></x-import>
          <x-import component-from-global-scope="LumnoDesignSystem_956520.StatCard" label="New clients" value="3" accent="coral" hint-size="1,1"></x-import>
          <x-import component-from-global-scope="LumnoDesignSystem_956520.StatCard" label="Notes overdue" value="1" accent="citrus" hint-size="1,1"></x-import>
          <x-import component-from-global-scope="LumnoDesignSystem_956520.StatCard" label="Outstanding balance" value="$300" accent="sage" hint-size="1,1"></x-import>
        </div>
        <div>
          <div style="font-size:18px;font-weight:700;margin-bottom:10px;color:var(--text-primary)">Upcoming sessions</div>
          <div style="display:flex;flex-direction:column;gap:10px">
            <sc-for list="{{ upcoming }}" as="c" hint-placeholder-count="4">
              <x-import component-from-global-scope="LumnoDesignSystem_956520.Card" interactive="{{ true }}" hint-size="100%,66px">
                <div style="display:flex;align-items:center;gap:12px">
                  <x-import component-from-global-scope="LumnoDesignSystem_956520.Avatar" name="{{ c.name }}" hint-size="36,36"></x-import>
                  <div style="flex:1;min-width:0">
                    <div style="font-weight:700;color:var(--text-primary)">{{ c.name }}</div>
                    <div style="font-size:13px;color:var(--text-muted)">{{ c.next }}</div>
                  </div>
                  <x-import component-from-global-scope="LumnoDesignSystem_956520.Badge" tone="{{ c.tone }}" hint-size="auto,22px">{{ c.status }}</x-import>
                  <a href="{{ c.notesHref }}"><x-import component-from-global-scope="LumnoDesignSystem_956520.Button" size="sm" variant="secondary" hint-size="auto,32px">Notes</x-import></a>
                </div>
              </x-import>
            </sc-for>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  clients = [
    { name: 'Maria Chen', next: 'Today · 2:00 PM', status: 'confirmed', tone: 'success' },
    { name: 'James Okoro', next: 'Tomorrow · 10:00 AM', status: 'pending', tone: 'warning' },
    { name: 'Priya Nair', next: 'Thu · 9:30 AM', status: 'confirmed', tone: 'success' },
    { name: 'Leo Fischer', next: 'Fri · 1:00 PM', status: 'confirmed', tone: 'success' },
  ];
  componentDidMount() { this.renderIcons(); }
  componentDidUpdate() { this.renderIcons(); }
  renderIcons() { if (window.lucide) window.lucide.createIcons({ nameAttr: 'data-lucide' }); }
  renderVals() {
    const upcoming = this.clients.map((c) => ({ ...c, notesHref: 'Notes.dc.html?client=' + encodeURIComponent(c.name) }));
    return { todayCount: 4, upcoming };
  }
}
</script>
</body>
</html>
